services:
  backend:
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --root-path
      - /api
      - --reload
      - --reload-dir
      - /app
      - --timeout-graceful-shutdown
      - "5"
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          initial_sync: true
          ignore:
            - requirements.txt
            - Dockerfile
            - docker-entrypoint.sh
            - init-test-db.sql
        - action: rebuild
          path: ./backend/requirements.txt
        - action: rebuild
          path: ./backend/Dockerfile
        - action: rebuild
          path: ./backend/docker-entrypoint.sh

  frontend:
    build:
      target: build
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80", "--strictPort"]
    environment:
      HOUSEMATE_API_TARGET: http://backend:8001
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          initial_sync: true
          ignore:
            - package.json
            - package-lock.json
            - Dockerfile
            - nginx.conf
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/Dockerfile

# 本機開發用的 PostgreSQL。只聽 127.0.0.1，所以不設密碼（trust）。
# 部署時改用雲端 PostgreSQL，只要換 DATABASE_URL。
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: housemate
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
